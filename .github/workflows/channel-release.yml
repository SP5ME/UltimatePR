name: Branch update packages

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: update-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x', cache: true}
      - run: go test ./...
      - run: go vet ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goarch: amd64, suffix: amd64}
          - {goarch: arm64, suffix: arm64}
          - {goarch: arm, goarm: '7', suffix: armv7}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x', cache: true}
      - name: Build branch package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          short="${GITHUB_SHA::7}"
          channel="$GITHUB_REF_NAME"
          base="$(sed -n 's/var BuildVersion = "\([0-9][0-9.]*[0-9]\).*/\1/p' internal/bbs/version.go)"
          version="${base}.dev-$(date -u +%Y-%m-%d)-${short}"
          dir="ultimatepr-$channel-linux-${{ matrix.suffix }}"
          mkdir -p "dist/$dir"
          go build -trimpath -ldflags="-s -w -X github.com/packet-radio/ultimatepr/internal/bbs.BuildVersion=$version" -o "dist/$dir/ultimatepr" ./cmd/server
          cp README.md LICENSE dist/$dir/
          cp install-ultimatepr.sh scripts/install.sh scripts/ultimatepr-update scripts/ultimatepr.service scripts/ultimatepr.openrc dist/$dir/
          chmod +x "dist/$dir/ultimatepr" "dist/$dir/install-ultimatepr.sh" "dist/$dir/install.sh" "dist/$dir/ultimatepr-update" "dist/$dir/ultimatepr.openrc"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ultimatepr-${{ github.ref_name }}-linux-${{ matrix.suffix }}
          path: dist/ultimatepr-${{ github.ref_name }}-linux-${{ matrix.suffix }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: release, merge-multiple: true}
      - name: Replace branch update release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          cd release
          tag="$GITHUB_REF_NAME-latest"
          short="${GITHUB_SHA::7}"
          base="$(sed -n 's/var BuildVersion = "\([0-9][0-9.]*[0-9]\).*/\1/p' ../internal/bbs/version.go)"
          title="${base}.dev-$(date -u +%Y-%m-%d)-${short}"
          printf '%s\n' "$title" > VERSION.txt
          sha256sum *.tar.gz > SHA256SUMS.txt
          notes="Automatyczny pakiet aktualizacyjny z gałęzi $GITHUB_REF_NAME. Konfiguracja użytkownika nie jest częścią pakietu."
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" * --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --title "$title" --notes "$notes"
          else
            gh release create "$tag" * --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag --title "$title" --notes "$notes"
          fi
