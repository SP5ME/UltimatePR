name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: linux
            goarch: arm
            goarm: '7'
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Set package name
        id: package
        shell: bash
        run: |
          suffix="${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then suffix="${suffix}v${{ matrix.goarm }}"; fi
          echo "name=ultimatepr-${GITHUB_REF_NAME}-${suffix}" >> "$GITHUB_OUTPUT"
      - name: Build executable
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p "dist/${{ steps.package.outputs.name }}"
          binary="ultimatepr"
          version="${GITHUB_REF_NAME#v} - $(date -u +%Y-%m-%d)"
          go build -trimpath -ldflags="-s -w -X github.com/packet-radio/ultimatepr/internal/bbs.BuildVersion=$version" -o "dist/${{ steps.package.outputs.name }}/$binary" ./cmd/server
          cp README.md LICENSE "dist/${{ steps.package.outputs.name }}/"
          cp docs/INSTRUKCJA-PL.txt docs/USER-MANUAL-EN.txt "dist/${{ steps.package.outputs.name }}/"
          cp install-ultimatepr.sh scripts/install.sh scripts/ultimatepr-update scripts/ultimatepr.service scripts/ultimatepr.openrc "dist/${{ steps.package.outputs.name }}/"
          chmod +x "dist/${{ steps.package.outputs.name }}/ultimatepr" "dist/${{ steps.package.outputs.name }}/install-ultimatepr.sh" "dist/${{ steps.package.outputs.name }}/install.sh" "dist/${{ steps.package.outputs.name }}/ultimatepr-update" "dist/${{ steps.package.outputs.name }}/ultimatepr.openrc"
      - name: Create archive
        shell: bash
        run: |
          cd dist
          tar -czf "${{ steps.package.outputs.name }}.tar.gz" "${{ steps.package.outputs.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --notes-file RELEASE_NOTES.md --title "UltimatePR $GITHUB_REF_NAME"
