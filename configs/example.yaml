application:
  mode: station-node-bbs
  operator_name: Jan
  locator: AA00AA
  qth: Example
  language: en
  update_channel: main
  terminal_eol: cr
  ax25_t1_seconds: 10
  ax25_t3_seconds: 300
  ax25_n2: 10
  ax25_n1: 256
  welcome_message: "Witaj {REMOTE}, de {CALL}.\r\nDostepne komendy: /I, /MH, /H lub /?."
  goodbye_message: "73 {REMOTE}, de {CALL}."
  info_message: "Call: {CALL}\r\nImię: {NAME}\r\nLOC: {LOC}\r\nQTH: {QTH}\r\n73"
server: {callsign: N0CALL, ssid: 7}
web:
  listen: 0.0.0.0:8080
  username: admin
  allowed_addresses: [0.0.0.0, "::"]
ports: []
terminal: {callsign: N0CALL, ssid: 0}
beacon:
  enabled: false
  destination: BEACON
  via: ""
  text: "{LOC}"
  interval_minutes: 30
uprd:
  enabled: true
  interval_seconds: 600
  mheard_limit: 5
history:
  enabled: true
  database: data/history.json
  max_stations: 200
  max_sessions_per_station: 50
  max_lines_per_station: 2000
  max_bytes: 10485760
  retention_days: 90
bbs:
  enabled: true
  listen: 127.0.0.1:8023
  forward_listen: 127.0.0.1:8024
  database: data/bbs.json
  title: N0CALL BBS
  callsign: N0CALL
  ssid: 8
  hierarchical_address: ""
  language: en
  beacon_via: ""
  forwarding:
    enabled: false
    interval_minutes: 15
    connect_timeout_seconds: 15
    session_timeout_seconds: 120
    max_messages_per_session: 50
    max_body_bytes: 131072
    peers: []
node:
  enabled: true
  alias: N0CALL
  listen: 127.0.0.1:8010
  language: en
  neighbors: []
  routes: []
  services:
    - {name: BBS, callsign: N0CALL-8, command: BBS, enabled: true}
