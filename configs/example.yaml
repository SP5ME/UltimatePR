application:
  mode: station-node-bbs
  operator_name: Jan
  locator: AA00AA
  qth: Example
  language: en
  update_channel: main
  terminal_eol: cr
  ax25_t1_seconds: 10
  ax25_t3_seconds: 300
  ax25_n2: 10
  ax25_n1: 256
  welcome_message: "Witaj {REMOTE}, de {CALL}.\r\nDostepne komendy: /I, /MH, /H lub /?."
  goodbye_message: "73 {REMOTE}, de {CALL}."
  info_message: "Call: {CALL}\r\nImię: {NAME}\r\nLOC: {LOC}\r\nQTH: {QTH}\r\n73"
server: {callsign: N0CALL, ssid: 7}
web:
  listen: 0.0.0.0:8080
  username: admin
  allowed_addresses: [0.0.0.0, "::"]
api:
  enabled: false
  # Generate with: printf '%s' 'TOKEN' | sha256sum
  tokens: []
ports: []
terminal: {callsign: N0CALL, ssid: 0}
beacon:
  enabled: false
  destination: BEACON
  via: ""
  text: "{LOC}"
  interval_minutes: 30
uprd:
  enabled: true
  interval_seconds: 600
  mheard_limit: 5
experimental:
  uprd: true
  map: true
  services: true
history:
  enabled: true
  database: data/history.json
  max_stations: 200
  max_sessions_per_station: 50
  max_lines_per_station: 2000
  max_bytes: 10485760
  retention_days: 90
bbs:
  enabled: true
  listen: 127.0.0.1:8023
  forward_listen: 127.0.0.1:8024
  database: data/bbs.json
  title: N0CALL BBS
  callsign: N0CALL
  ssid: 8
  hierarchical_address: ""
  language: en
  beacon_via: ""
  welcome_message: "Welcome {REMOTE} to BBS {CALL}. Type H for help."
  goodbye_message: "73 {REMOTE}, BBS {CALL}."
  forwarding:
    enabled: false
    interval_minutes: 15
    connect_timeout_seconds: 15
    session_timeout_seconds: 120
    max_messages_per_session: 50
    max_body_bytes: 131072
    peers: []
node:
  enabled: true
  alias: N0CALL
  listen: 127.0.0.1:8010
  language: en
  welcome_message: "Welcome {REMOTE} to NODE {CALL}. Commands: NODES, ROUTES, PORTS, SERVICES, BBS, AI, CONNECT and HELP."
  goodbye_message: "73 {REMOTE}, NODE {CALL}."
  neighbors: []
  routes: []
  services:
    - {name: BBS, callsign: N0CALL-8, command: BBS, enabled: true}
ai:
  enabled: false
  callsign: N0CALL
  ssid: 12
  provider: ollama
  url: http://192.168.1.50:11434
  model: qwen3:8b
  timeout_seconds: 120
  max_response_chars: 2000
  max_context: 20
  system_prompt: "You are a concise packet-radio assistant."
  welcome_message: "Welcome {REMOTE} to AI service {CALL}. End a single-line or multi-line question with /EX. Q ends the conversation."
  processing_message: "Thank you for your message. I am processing it now. Please be patient — the response may take up to a few minutes."
  goodbye_message: "73 {REMOTE}, AI {CALL}."
  queue_size: 8
  concurrency: 1
